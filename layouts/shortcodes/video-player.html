{{ $id := .Get "id" | default "player" }}
{{ $src := .Get "src" }}
{{ $type := .Get "type" | default "video/webm" }}

<!-- Charger les assets uniquement si ce n'est pas déjà fait -->
<link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

<div style="max-width: 100%; margin: 1rem 0;">
  <video
    id="{{ $id }}"
    class="video-js vjs-default-skin vjs-big-play-centered"
    controls
    preload="auto"
    style="width: 100%;"
  >
    <source src="{{ $src }}" type="{{ $type }}">
    <p class="vjs-no-js">
      Pour visionner cette vidéo, veuillez activer JavaScript ou utiliser un navigateur supportant le HTML5 video.
    </p>
  </video>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof videojs !== 'undefined') {
      videojs('{{ $id }}', {
        playbackRates: [0.5, 0.75, 1, 1.25, 1.5, 2],
        fluid: true,
        responsive: true
      });
    }
  });
</script>
